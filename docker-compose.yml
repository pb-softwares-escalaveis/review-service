services:
  review-service:
    container_name: review-service
    image: gabrielmeruzzi/review-service:latest
    restart: always
    ports:
      - "${REVIEW_SERVICE_PORT:-8084}:${REVIEW_SERVICE_PORT:-8084}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REVIEW_SERVICE_PORT: ${REVIEW_SERVICE_PORT:-8084}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      REVIEW_SERVICE_DB_USER: ${REVIEW_SERVICE_DB_USER}
      REVIEW_SERVICE_DB_PASSWORD: ${REVIEW_SERVICE_DB_PASSWORD}
      KAFKA_SERVERS: ${KAFKA_SERVERS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - leilao-network
    depends_on:
      review-postgres:
        condition: service_healthy

  review-postgres:
    image: postgres:15-alpine
    container_name: review-postgres
    ports:
      - "${REVIEW_SERVICE_DB_PORT:-5439}:5432"
    environment:
      POSTGRES_DB: review
      POSTGRES_USER: ${REVIEW_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${REVIEW_SERVICE_DB_PASSWORD}
    volumes:
      - review-postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  leilao-network:
    external: true

volumes:
  review-postgres-data:
