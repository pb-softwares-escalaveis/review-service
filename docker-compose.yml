services:
  app:
    build: .
    image: review-service:latest
    container_name: review-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/review
      SPRING_DATASOURCE_USERNAME: review
      SPRING_DATASOURCE_PASSWORD: review
      SPRING_KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: review-postgres
    ports:
      - "5439:5432"
    environment:
      POSTGRES_DB: review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
    volumes:
      - review-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  review-postgres-data:
