server:
  port: ${REVIEW_SERVICE_PORT}

spring:
  application:
    name: review-service
  profiles:
    active: prod

  datasource:
    url: ${REVIEW_SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/review}
    username: ${REVIEW_SERVICE_DB_USER:review}
    password: ${REVIEW_SERVICE_DB_PASSWORD:review}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: review-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.add.type.headers: false
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
    register-with-eureka: true
    fetch-registry: false
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name:review}
    version: 1.0.0
    description: Review Service do O Leiloeiro Online

resilience4j:
  retry:
    instances:
      geminiReviewService:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - com.service.review.exception.ReviewProviderException
          - java.io.IOException
          - java.net.SocketTimeoutException
  circuitbreaker:
    instances:
      geminiReviewService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.service.review.exception.ReviewProviderException
          - java.io.IOException
          - java.net.SocketTimeoutException

app:
  kafka-topics:
    reviews:
      report:
        auction-approved: reviews.report.auction-approved
        auction-rejected: reviews.report.auction-rejected
        qa-approved: reviews.report.qa-approved
        qa-rejected: reviews.report.qa-rejected
      auction:
        approved: reviews.auction.approved
        rejected: reviews.auction.rejected
      qa:
        approved: reviews.qa.approved
        rejected: reviews.qa.rejected
