server:
  port: 8081

spring:
  application:
    name: review
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/review
    username: review
    password: review
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: review-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.add.type.headers: false
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

resilience4j:
  retry:
    instances:
      reviewService:
        max-attempts: 3
        wait-duration: 1m

app:
  kafka-topics:
    review:
      report-auction-review-approved: "review.report.auction.approved"
      report-message-review-approved: "review.report.auction.approved"
      auction-review-approved: "review.auction.approved"
      auction-review-rejected: "review.auction.rejected"
      qa-review-approved: "review.qa.approved"
      qa-review-rejected: "review.qa.rejected"
