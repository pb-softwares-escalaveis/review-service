spring.application.name=review

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/review
spring.datasource.username=review
spring.datasource.password=review
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=review-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Topics
app.kafka-topics.review.auction-review-approved=auction.review.approved
app.kafka-topics.review.auction-review-rejected=auction.review.rejected
app.kafka-topics.review.qa-review-approved=qa.review.approved
app.kafka-topics.review.qa-review-rejected=qa.review.rejected